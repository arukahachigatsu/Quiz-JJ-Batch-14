<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:28px;font-weight:700;margin:8px 0 4px;letter-spacing:.02em}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
ruby{ruby-position:over}
rt{font-size:.42em;font-weight:500;color:var(--mute);letter-spacing:.02em}
.dcard{background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:16px;margin-bottom:12px}
.dbtn{width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:20px;padding:20px 22px}
.dbtn b{display:block;font-size:20px;font-weight:700}
.dbtn small{color:var(--mute);font-size:14px}
.dcard .dbtn+.dbtn{margin-top:12px}
.dbtn.gk{text-align:center;padding:16px}.dbtn.gk b{font-size:16px;font-weight:500}
.ctr{text-align:center;font-size:26px;margin:8px 0 18px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h2{flex:1;margin:0;font-size:20px;font-weight:700}
.back{width:44px;height:44px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--acc);padding:0;flex:none}
.back:active{transform:scale(.93)}
.cats{display:grid;gap:10px}
.cat{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.cat:active{transform:scale(.99)}
.cat .k{font-size:24px;font-weight:700;width:46px;height:46px;border-radius:12px;background:var(--accsoft);background:color-mix(in srgb,var(--tf,var(--acc)) 16%,transparent);color:var(--tf,var(--acc));display:grid;place-items:center;flex:none}
.cat b{display:block;font-size:17px;font-weight:700}
.cat small{color:var(--mute);font-size:14px}
.cat .best{margin-left:auto;font-size:14px;color:var(--ok);font-weight:700;white-space:nowrap}
.mix{background:linear-gradient(135deg,#60A5FA,#7AB4FB);border-color:#60A5FA;color:#0F172A;margin-bottom:14px}
.mix .k{background:rgba(15,23,42,.14);color:#0F172A}
.mix small,.mix .best{color:rgba(15,23,42,.8)}
.cnt{font-size:14px;color:var(--mute);min-width:44px;text-align:right}
.bar{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .35s}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:28px 18px;text-align:center;margin-bottom:16px}
.q .lab{color:var(--mute);font-size:14px;margin-bottom:10px}
.q .w{font-size:46px;font-weight:700;line-height:1.5;word-break:keep-all}
.q .w.id{font-size:30px;line-height:1.3}
.q .r{min-height:26px;color:var(--acc);font-size:16px;margin-top:8px;opacity:0;transition:opacity .25s}
.q .r.on{opacity:1}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font-size:17px;min-height:56px}
.opt .n{width:26px;height:26px;border-radius:8px;background:var(--accsoft);color:var(--acc);font-size:14px;font-weight:700;display:grid;place-items:center;flex:none}
.opt.jp{font-size:28px;font-weight:500;line-height:1.7;padding:14px 16px;min-height:76px}.opt.jp rt{font-size:.44em}
.opt.ok{background:var(--oksoft);border-color:var(--ok)}
.opt.bad{background:var(--badsoft);border-color:var(--bad);animation:sh .3s}

.opt:disabled:not(.ok):not(.bad){opacity:.55}

.opt.hj{font-size:19px;min-height:56px;line-height:1.6;padding:12px 16px;font-weight:500}
.dlg{text-align:left;margin-top:2px}

.dr.sr .bub{--bg:#453645}

.dr.sr .bub::before{right:-10px;border-width:10px 0 10px 10px;border-left-color:var(--bg)}
.bub rt{color:#CBD5E1}

.go{visibility:hidden}.go.on{visibility:visible}

.score p{color:var(--mute);margin:10px 0 0}
.wrong{background:var(--card);border:1.5px solid var(--line);border-radius:16px;margin:20px 0;padding:6px 16px}

.row>span:last-child{text-align:right;color:var(--mute);font-size:15px}
.btns{display:grid;gap:10px}
.sec{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:700;font-size:16px}

.inp{display:block;width:100%;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;margin-bottom:10px}

.arow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.arow .dbtn{margin:0}
.dbtn.pri{background:var(--acc);border-color:var(--acc);color:#0F172A}

.fcard.done{border-color:var(--ok)}
.fcard.done small{color:var(--ok);font-weight:700}
.msg{text-align:center;color:var(--mute);padding:28px 8px}

/* Simpan nilai harian: user_scores/{userId}/daily/{dateKey}. Hanya menimpa jika persentase lebih tinggi. */
async function saveScore(dateKey,score,total){
const u=uid();if(!u||!total)return false;
try{
const ref=dailyRef(u,dateKey);
await db.runTransaction(async tx=>{
const s=await tx.get(ref),o=s.exists?s.data():null;
if(o&&o.total&&o.score/o.total>=score/total)return;
tx.set(ref,{score,total,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
});
return true;
}catch(e){console.error('saveScore gagal:',e);return false}
}

<div class="opts">${S.opts.map((o,n)=>`<button class="opt ${rev?'jp':''}" data-n="${n}"><span class="n">${n+1}</span><span>${rev?F(o.jp):o.id}</span></button>`).join('')}</div>
<div class="fb" id="fb" aria-live="polite"></div><button class="go" id="go">${S.i+1===S.list.length?'Lihat hasil':'Lanjut'}</button>`;
$.querySelector('#bk').onclick=()=>S.mode?modeMenu():dayMenu(day);
$.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
$.querySelector('#go').onclick=next;
}

function pick(n){
if(S.done)return;S.done=true;
const q=S.q,c=S.opts[n]===q,btns=$.querySelectorAll('.opt');
btns.forEach((b,k)=>{b.disabled=true;if(S.opts[k]===q)b.classList.add('ok');else if(k===n)b.classList.add('bad')});
if(c)S.ok++;else S.bad.push(q);
const fb=$.querySelector('#fb');fb.className='fb '+(c?'ok':'bad');
fb.innerHTML=c?'Jawaban Anda benar.':`Jawaban kurang tepat. Jawaban yang benar: ${S.rev?F(q.jp):q.id}`;
$.querySelector('#go').classList.add('on');
$.querySelector('#go').focus({preventScroll:true});
}

function next(){if(!S.done)return;S.i++;S.i<S.list.length?ask():result()}

function result(){
const t=S.list.length,pc=S.ok/t;
const bk=day+':'+S.c+(S.mode?':'+S.mode:'');if(!S.retry&&(best[bk]==null||S.ok>best[bk])){best[bk]=S.ok;save()}

const msg=pc===1?'Sempurna. Semua jawaban Anda benar.':pc>=.8?'Sangat baik. Sedikit lagi sempurna.':pc>=.5?'Cukup baik. Ulangi kata yang salah agar lebih mudah diingat.':'Jangan berkecil hati. Silakan ulangi secara perlahan.';
$.innerHTML=`<div class="score"><div class="big">${S.ok}<span>/${t}</span></div><p>${msg}</p></div>
${S.bad.length?`<div class="wrong"><h2>Kata yang perlu diulang</h2>${S.bad.map(w=>`<div class="row"><span class="j">${F(w.jp)}</span><span>${w.id}</span></div>`).join('')}</div>`:''}

const rw=$.querySelector('#rw');if(rw)rw.onclick=()=>{start(c,bad,md);S.retry=1};

}

const bl=(t,f)=>rb(t).replace('＿＿＿',f?`<b class="fill">${rb(f)}</b>`:'<span class="blank">＿＿＿</span>');
const AV={l:['#4B3628','#F1D7B8'],r:['#2E2A2A','#EED3B6']};
const avatar=x=>`<svg class="av" viewBox="0 0 100 115" aria-hidden="true"><path d="M0 115A50 46 0 0 1 100 115z" fill="#A5B4BE"/><circle cx="50" cy="36" r="30.5" fill="${AV[x][1]}"/><path d="M19.5 36C19 12 33 0 50 0s31 12 30.5 36C74 26 63 20 50 20s-24 6-30.5 16z" fill="${AV[x][0]}"/></svg>`;
const dlg=(q,f)=>q.d.map(l=>{const x=l[0]==='A'?'l':'r';return `<div class="dr s${x}">${avatar(x)}<div class="bub">${bl(l[1],f)}</div></div>`}).join('');
function hyStart(items){S={hy:1,list:shuf(items||HY[day]),i:0,ok:0,bad:[],done:false};hyAsk()}
function hyAsk(){
const q=S.list[S.i];S.q=q;S.opts=shuf([q.k].concat(q.w));S.done=false;
const p=Math.round(S.i/S.list.length*100);
$.innerHTML=`<div class="top"><button class="back" aria-label="Kembali" id="bk">${ARROW}</button><div class="bar"><i style="width:${p}%"></i></div><span class="cnt">${S.i+1}/${S.list.length}</span></div>
<div class="q hyq"><div class="lab">Lengkapi percakapan berikut.</div><div class="dlg" id="dl">${dlg(q)}</div></div>
<div class="opts">${S.opts.map((o,n)=>`<button class="opt jp hj" data-n="${n}"><span class="n">${n+1}</span><span>${rb(o)}</span></button>`).join('')}</div>
<div class="fb" id="fb" aria-live="polite"></div><div id="ex"></div><button class="go" id="go">${S.i+1===S.list.length?'Lihat hasil':'Lanjut'}</button>`;
$.querySelector('#bk').onclick=()=>dayMenu(day);
$.querySelectorAll('.opt').forEach(b=>b.onclick=()=>hyPick(+b.dataset.n));
$.querySelector('#go').onclick=hyNext;
}
function hyPick(n){
if(S.done||n>=S.opts.length)return;S.done=true;
const q=S.q,c=S.opts[n]===q.k;
$.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(S.opts[k]===q.k)b.classList.add('ok');else if(k===n)b.classList.add('bad')});
if(c)S.ok++;else S.bad.push(q);
const fb=$.querySelector('#fb');fb.className='fb '+(c?'ok':'bad');
fb.textContent=c?'Jawaban Anda benar.':'Jawaban kurang tepat.';
$.querySelector('#dl').innerHTML=dlg(q,q.k);
$.querySelector('#ex').innerHTML=`<div class="ex"><b>Kunci jawaban: ${rb(q.k)}</b><p>${q.t.split('|').join('<br>')}</p><p>${q.e}</p></div>`;
const g=$.querySelector('#go');g.classList.add('on');g.focus({preventScroll:true});
}
function hyNext(){if(!S.done)return;S.i++;S.i<S.list.length?hyAsk():hyResult()}
function hyResult(){
const t=S.list.length,pc=S.ok/t,bk=day+':hy';
if(!S.retry&&(best[bk]==null||S.ok>best[bk])){best[bk]=S.ok;save()}
if(!S.retry)saveScore(day,S.ok,t);
const msg=pc===1?'Sempurna. Semua jawaban Anda benar.':pc>=.8?'Sangat baik. Sedikit lagi sempurna.':pc>=.5?'Cukup baik. Ulangi ungkapan yang salah agar lebih mudah diingat.':'Jangan berkecil hati. Silakan ulangi secara perlahan.';
$.innerHTML=`<div class="score"><div class="big">${S.ok}<span>/${t}</span></div><p>${msg}</p></div>
${S.bad.length?`<div class="wrong"><h2>Ungkapan yang perlu diulang</h2>${S.bad.map(w=>`<div class="row"><span class="j">${rb(w.k)}</span><span>${w.m}</span></div>`).join('')}</div>`:''}
<div class="btns">${S.bad.length?'<button class="pri" id="rw">Ulangi ungkapan yang salah</button>':''}<button class="${S.bad.length?'sec':'pri'}" id="ra">Ulangi kuis</button><button class="sec" id="hm">Kembali ke menu</button></div>`;
const bad=S.bad.slice();
const rw=$.querySelector('#rw');if(rw)rw.onclick=()=>{hyStart(bad);S.retry=1};
$.querySelector('#ra').onclick=()=>hyStart();
$.querySelector('#hm').onclick=()=>dayMenu(day);
}

document.addEventListener('keydown',e=>{
if(!S||!S.q)return;
if(e.key>='1'&&e.key<='4'&&!S.done&&$.querySelector('.opt')){(S.hy?hyPick:pick)(+e.key-1)}
else if(e.key==='Enter'&&S.done&&$.querySelector('#go')){e.preventDefault();(S.hy?hyNext:next)()}
});

else auth.onAuthStateChanged(u=>u?home():authScreen());
